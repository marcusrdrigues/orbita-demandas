# Somente o MySQL. API e web rodam com npm direto no Node local.
# Os scripts de /docker-entrypoint-initdb.d só rodam na primeira criação do volume;
# para recarregar schema e seed: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: orbita-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: orbita
      MYSQL_USER: orbita
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - orbita-mysql-dados:/var/lib/mysql
      - ./db/00-banco-teste.sql:/docker-entrypoint-initdb.d/00-banco-teste.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  orbita-mysql-dados:
